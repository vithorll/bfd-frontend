<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width-device-width, initial-scale=1.0">

        <title>Photo Carousel</title>

        <link rel="stylesheet" href="./css/style.css">
    </head>

    <body>
        <header></header>
        
        <main>
            <section id="basic-carousel">
                <h1>Basic Carousel</h1>
                <section class="content">
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                </section>
            </section>

            <section id="snap-carousel">
                <h1>Snap Carousel</h1>
                <section class="content">
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                </section>
            </section>

            <section id="arrow-carousel">
                <h1>Arrow Carousel</h1>

                <button class="arrow prev" aria-label="Previous Photo">&#8592;</button>
                <section class="content">
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                    <div class="photo"></div>
                </section>
                <button class="arrow next" aria-label="Next Photo">&#8594;</button>
            </section>
        </main>

        <footer></footer>

        <script>
            const rail = document.querySelector('#arrow-carousel .content');
            document.querySelector('.next').onclick = () => {
                rail.scrollBy({ left: 160, behavior: 'smooth' });
            };
            document.querySelector('.prev').onclick = () => {
                rail.scrollBy({ left: -160, behavior: 'smooth' });
            };
        </script>
    </body>    
</html>
